name: Ubuntu + Tailscale

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest

    steps:

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Check Tailscale
        run: |
          tailscale status
          tailscale ip
